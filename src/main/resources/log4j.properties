log4j.rootLogger= ${log.level} , stdout , master_file

log4j.logger.com.tasnetwork.calibration.conveyor.conveyor=${log.level},ConveyorDebug
log4j.logger.com.tasnetwork.calibration.conveyor.bay.calib=${log.level},CalibTestBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.comm=${log.level},ComTestBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.ft=${log.level},FunctionalTestBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.ir=${log.level},IrTestBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.hv=${log.level},HvTestBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.verific=${log.level},VerificTestBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.verific_waiting=${log.level},WaitingBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.sta_nld1=${log.level},StaNldtBay1
log4j.logger.com.tasnetwork.calibration.conveyor.bay.sta_nld2=${log.level},StaNldtBay2
log4j.logger.com.tasnetwork.calibration.conveyor.bay.unloading=${log.level},UnloadingBay
log4j.logger.com.tasnetwork.calibration.conveyor.bay.rejection=${log.level},RejectionBay
log4j.logger.com.tasnetwork.calibration.conveyor.plc=${log.level},Plc

log4j.logger.org.hibernate = WARN

# Redirect logs to console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{1}:%L - %m%n

# MASTER FILE APPENDER (Logs Everything)
log4j.appender.master_file=org.apache.log4j.FileAppender
log4j.appender.master_file.File=./logs/${AppName}_${Version}__${current.date.time}_MASTER_log.txt
log4j.appender.master_file.Append=false
log4j.appender.master_file.layout=org.apache.log4j.PatternLayout
log4j.appender.master_file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{1}:%L - %m%n

