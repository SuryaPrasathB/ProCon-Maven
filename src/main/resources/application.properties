# Spring Application Properties
spring.application.name=procon-spring

# Component Scanning
spring.component-scan.base-packages=com.tasnetwork.spring
spring.data.jpa.repositories.base-package=com.tasnetwork.spring.orm.repository
spring.data.jpa.auditing.enabled=true

# Datasource Configuration
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/procon_spring_v1_0?characterEncoding=latin1&useSSL=false&createDatabaseIfNotExist=true&connectTimeout=5000&socketTimeout=10000
spring.datasource.username=root
spring.datasource.password=lscontrols

# JPA/Hibernate Properties
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.ejb.naming_strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Transaction Management
spring.jpa.transaction.type=JPA

logging.level.org.springframework.data.repository.config=WARN

